spring:
  application:
    name: backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# API docs (OpenAPI + Swagger UI) disabled by default; enabled only in the local profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    issuer: facturas-backend
