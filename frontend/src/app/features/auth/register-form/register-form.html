<mat-card appearance="outlined" class="auth-card">
  <mat-card-header class="auth-card-header">
    <h1 mat-card-title>Crear cuenta</h1>
  </mat-card-header>
  <mat-card-content class="auth-card-content">
    <form (submit)="submit($event)" novalidate class="form">
      <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input
          matInput
          id="register-firstName"
          type="text"
          autocomplete="given-name"
          [errorStateMatcher]="matchers.firstName"
          [formField]="registerForm.firstName"
        />
        <mat-error>{{ errorOf('firstName') }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Apellidos</mat-label>
        <input
          matInput
          id="register-lastName"
          type="text"
          autocomplete="family-name"
          [errorStateMatcher]="matchers.lastName"
          [formField]="registerForm.lastName"
        />
        <mat-error>{{ errorOf('lastName') }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Email</mat-label>
        <input
          matInput
          id="register-email"
          type="email"
          autocomplete="email"
          [errorStateMatcher]="matchers.email"
          [formField]="registerForm.email"
        />
        <mat-error>{{ errorOf('email') }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          id="register-password"
          autocomplete="new-password"
          [type]="passwordMasked() ? 'password' : 'text'"
          [errorStateMatcher]="matchers.password"
          [formField]="registerForm.password"
        />
        <button
          matIconButton
          matSuffix
          type="button"
          class="mask-toggle"
          [attr.aria-label]="passwordMasked() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          (click)="passwordMasked.set(!passwordMasked())"
        >
          <mat-icon>{{ passwordMasked() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error>{{ errorOf('password') }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Confirmar contraseña</mat-label>
        <input
          matInput
          id="register-confirmPassword"
          autocomplete="new-password"
          [type]="confirmPasswordMasked() ? 'password' : 'text'"
          [errorStateMatcher]="matchers.confirmPassword"
          [formField]="registerForm.confirmPassword"
        />
        <button
          matIconButton
          matSuffix
          type="button"
          class="mask-toggle"
          [attr.aria-label]="confirmPasswordMasked() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          (click)="confirmPasswordMasked.set(!confirmPasswordMasked())"
        >
          <mat-icon>{{ confirmPasswordMasked() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error>{{ errorOf('confirmPassword') }}</mat-error>
      </mat-form-field>

      @if (serverError(); as message) {
        <app-form-alert [message]="message" />
      }

      <button
        matButton="filled"
        type="submit"
        class="submit"
        [disabled]="loading()"
        disabledInteractive
        [attr.aria-busy]="loading()"
      >
        @if (loading()) {
          <mat-progress-spinner mode="indeterminate" diameter="18" aria-hidden="true" />
        }
        Crear cuenta
      </button>

      <p class="switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </form>
  </mat-card-content>
</mat-card>
