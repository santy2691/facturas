@if (user(); as user) {
  <button
    matButton
    type="button"
    class="trigger"
    [matMenuTriggerFor]="menu"
    [attr.aria-label]="'Cuenta de ' + fullName()"
    [disabled]="loggingOut()"
    disabledInteractive
    [attr.aria-busy]="loggingOut()"
  >
    <!-- matButton wraps content in a non-flex label: our own row keeps it on one line. -->
    <span class="trigger-content">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="name">{{ user.firstName }}</span>
      @if (loggingOut()) {
        <mat-progress-spinner mode="indeterminate" diameter="18" aria-hidden="true" />
      } @else {
        <mat-icon aria-hidden="true">expand_more</mat-icon>
      }
    </span>
  </button>

  <mat-menu #menu="matMenu" xPosition="before" aria-label="Cuenta">
    <div class="identity">
      <span class="identity-name">{{ fullName() }}</span>
      <span class="identity-email">{{ user.email }}</span>
    </div>
    <button mat-menu-item type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
}
